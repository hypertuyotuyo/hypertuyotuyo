<!DOCTYPE html>

    .error-title { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.3rem, 4vw, 1.9rem); color: var(--ink); }
    .error-sub { font-size: 0.95rem; color: var(--text-muted); max-width: 26em; line-height: 1.9; }
